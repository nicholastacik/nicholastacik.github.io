name: TV tracker daily

on:
  schedule:
    # Off the top of the hour (GitHub drops/delays on-the-hour runs under load).
    # 10:17 UTC = 6:17 am EDT; 13:47 UTC is a backup that skips if 10:17 succeeded.
    - cron: "17 10 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-tracker-sheet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run daily job
        working-directory: tv-tracker
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: uv run --frozen --group tv-tracker python -m job ${{ github.event_name == 'schedule' && '--skip-if-ran-today' || '' }}
